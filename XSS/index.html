<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage y SessionStorage</title>

    <style>
       body {
            background-color: rgb(39, 86, 186);
            font-family: sans-serif;
            color: white;
            font-size: 1.2em;
            padding-left: 50px;
        }

        ul {
            padding: 25px;
            background-color: rgb(24, 52, 112);
            width: 500px;
            font-family: monospace;
             border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Persistencia en el navegador</h1>
    <h2>LocalStorage</h2>
    <p>permite guardar datos en el navegador de manera persistente.</p>

    <h3>Contenido actual:</h3>
    <ul id="local"></ul>

    <h2>SessionStorage</h2>
    <p>permite guardar datos en el navegador de manera temporal.</p>

    <h3>Contenido actual:</h3>
    <ul id="session"></ul>

     <script>
        const listaLocal = document.querySelector("#local");
        const listaSession = document.querySelector("#session");

        Object.keys(localStorage).forEach(clave => {
            listaLocal.innerHTML += `<li><b>${clave}</b>: ${localStorage.getItem(clave)}</li>`;
        });

        Object.keys(sessionStorage).forEach(clave => {
            listaSession.innerHTML += `<li><b>${clave}</b>: ${sessionStorage.getItem(clave)}</li>`;
        });
    </script>
</body>
</html>
